[project]
name = "siyuan-mcp"
version = "0.1.9"
description = "A focused SiYuan MCP server exposing low-level SiYuan document, block, search, attribute, and database tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.16.0"
]

[project.scripts]
siyuan-mcp = "siyuan_research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siyuan_research_mcp"]
